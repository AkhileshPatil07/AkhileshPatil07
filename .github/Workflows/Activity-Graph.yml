name: Generate Activity Graph

on:
  schedule:
    - cron: '0 */6 * * *'   # runs every 6 hours
  workflow_dispatch:         # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate github activity graph
        uses: Ashutosh00710/github-readme-activity-graph@v2.0.0
        with:
          username: AkhileshPatil07
          bg_color: 0A0F08
          color: CAFF3C
          line: 8AFF57
          point: CAFF3C
          area: true
          area_color: 1A2B0A
          hide_border: true
          output: github-contribution-grid-graph.svg

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add github-contribution-grid-graph.svg
          git diff --staged --quiet || git commit -m "Update activity graph"
          git push
